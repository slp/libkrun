[package]
name = "libkrun"
version = "1.14.0"
authors = ["Sergio Lopez <slp@redhat.com>"]
edition = "2021"
build = "build.rs"

[features]
tee = []
amd-sev = [ "blk", "tee" ]
net = []
blk = []
efi = [ "blk", "net" ]
gpu = [ "rutabaga_gfx" ]
snd = []
virgl_resource_map2 = []
nitro = [ "dep:nitro", "dep:nitro-enclaves" ]

[dependencies]
crossbeam-channel = ">=0.5.15"
env_logger = "0.11"
libc = ">=0.2.39"
libloading = "0.8"
log = "0.4.0"
nix = { version = "0.30.0", features = ["process", "socket"] }
once_cell = "1.4.1"

devices = { path = "../devices" }
polly = { path = "../polly" }
rutabaga_gfx = { path = "../rutabaga_gfx", features = ["virgl_renderer", "virgl_renderer_next"], optional = true }
utils = { path = "../utils" }
vmm = { path = "../vmm" }

[target.'cfg(target_os = "macos")'.dependencies]
hvf = { path = "../hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = ">=0.11", features = ["fam-wrappers"] }
kvm-ioctls = ">=0.21"
nitro = { path = "../nitro", optional = true }
nitro-enclaves = { version = "0.2.0", optional = true }
vm-memory = ">=0.13"

[lib]
name = "krun"
crate-type = ["cdylib"]
